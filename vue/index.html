<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>太极·八字命理</title>
    <script>
      ;(function () {
        var root = document.documentElement

        // ── Dark / light bootstrap ──
        var theme = localStorage.getItem('theme')
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = theme === 'dark' || (!theme && prefersDark)
        root.classList.toggle('dark', isDark)
        root.style.colorScheme = isDark ? 'dark' : 'light'

        // ── Five-element bootstrap (no FOUC) ──
        var WUXING = {
          mu: {
            hex: '#34d399',
            rgb: '34,211,153',
            dark: '#059669',
            lightAccent: '#047857',
            lightRgb: '4,120,87',
            btnText: '#00140e',
            primaryL: 'oklch(0.58 0.20 160)',
            primaryD: 'oklch(0.62 0.17 160)',
          },
          huo: {
            hex: '#fb7185',
            rgb: '251,113,133',
            dark: '#e11d48',
            lightAccent: '#be123c',
            lightRgb: '190,18,60',
            btnText: '#190005',
            primaryL: 'oklch(0.62 0.22 12)',
            primaryD: 'oklch(0.66 0.20 12)',
          },
          tu: {
            hex: '#fcd34d',
            rgb: '252,211,77',
            dark: '#d97706',
            lightAccent: '#92400e',
            lightRgb: '146,64,14',
            btnText: '#1a1000',
            primaryL: 'oklch(0.74 0.16 78)',
            primaryD: 'oklch(0.78 0.14 78)',
          },
          jin: {
            hex: '#e2e8f0',
            rgb: '226,232,240',
            dark: '#94a3b8',
            lightAccent: '#475569',
            lightRgb: '71,85,105',
            btnText: '#030404',
            primaryL: 'oklch(0.62 0.04 240)',
            primaryD: 'oklch(0.78 0.03 240)',
          },
          shui: {
            hex: '#22d3ee',
            rgb: '34,211,238',
            dark: '#2563eb',
            lightAccent: '#0369a1',
            lightRgb: '3,105,161',
            btnText: '#001116',
            primaryL: 'oklch(0.66 0.14 220)',
            primaryD: 'oklch(0.74 0.14 220)',
          },
        }
        var key = localStorage.getItem('bazi_element_theme')
        if (!WUXING[key]) key = 'mu'
        var t = WUXING[key]
        var activeAccent = isDark ? t.hex : t.lightAccent
        var activeRgb = isDark ? t.rgb : t.lightRgb
        var s = root.style
        s.setProperty('--jade-accent', t.hex)
        s.setProperty('--jade-accent-dark', t.dark)
        s.setProperty('--jade-accent-rgb', t.rgb)
        s.setProperty('--jade-button-text', t.btnText)
        s.setProperty('--accent', activeAccent)
        s.setProperty('--accent-dim', 'rgba(' + activeRgb + ', 0.14)')
        s.setProperty('--accent-glow', 'rgba(' + activeRgb + ', 0.22)')
        s.setProperty('--line-focus', activeAccent)
        s.setProperty('--brand-glow', 'rgba(' + activeRgb + ', 0.42)')
        s.setProperty('--menu-hover', 'rgba(' + activeRgb + ', 0.10)')
        s.setProperty('--primary', isDark ? t.primaryD : t.primaryL)
        s.setProperty('--ring', activeAccent)
        s.setProperty('--glow-primary', 'rgba(' + activeRgb + ', ' + (isDark ? 0.14 : 0.1) + ')')
        root.dataset.wuxing = key
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
